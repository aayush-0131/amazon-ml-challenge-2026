[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-ml-challenge-2026-ber"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "RapidFuzz==3.14.6",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "threadpoolctl==3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
