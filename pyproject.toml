[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-ml-challenge-2026-ber"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas==3.0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
